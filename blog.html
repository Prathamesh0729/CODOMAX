
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Read a complete blog on BlogSpace."
    >

    <title>BlogSpace | Blog</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="container navbar-container">

            <a href="index.html" class="logo">
                BlogSpace
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav-links" id="navLinks">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#featured">
                    Explore
                </a>

                <a href="dashboard.html" id="dashboardNavLink">
                    Dashboard
                </a>

                <a href="create-blog.html">
                    Write a Blog
                </a>

                <a href="login.html" id="loginNavLink">
                    Login
                </a>

                <a
                    href="register.html"
                    class="nav-button"
                    id="signupNavLink"
                >
                    Sign Up
                </a>

                <a href="#" id="logoutButton">
                    Logout
                </a>

            </nav>

        </div>

    </header>


    <!-- Blog Details -->
    <main class="blog-details-page">

        <div class="container">

            <article
                class="blog-details"
                id="blogDetails"
            >

                <div class="blog-loading">
                    <p>Loading blog...</p>
                </div>

            </article>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-content">

            <div>

                <h3>BlogSpace</h3>

                <p>
                    A place to write,
                    share, and discover ideas.
                </p>

            </div>

            <p>
                &copy; 2026 BlogSpace.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
