<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create your BlogSpace account.">

    <title>BlogSpace | Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container navbar-container">

            <a href="index.html" class="logo">
                BlogSpace
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#featured">Explore</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="nav-button active">
                    Sign Up
                </a>
            </nav>

        </div>
    </header>


    <!-- Register -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <p class="section-label">
                    GET STARTED
                </p>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Join BlogSpace and start sharing your ideas.
                </p>

            </div>


            <form class="auth-form" id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the terms

                    </label>

                </div>


                <button
                    type="submit"
                    class="primary-button auth-button"
                >
                    Create Account
                </button>


                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-content">

            <div>

                <h3>BlogSpace</h3>

                <p>
                    A place to write, share, and discover ideas.
                </p>

            </div>

            <p>
                © 2026 BlogSpace. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
