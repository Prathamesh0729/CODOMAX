
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create your BlogSpace account and start sharing your ideas.">

    <title>BlogSpace | Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="container navbar-container">

            <a href="index.html" class="logo">BlogSpace</a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="navLinks"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-links" id="navLinks" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="index.html#featured">Explore</a>
                <a href="login.html" id="loginNavLink">Login</a>
                <a href="register.html" class="nav-button" id="signupNavLink">Sign Up</a>
                <a href="dashboard.html" id="dashboardNavLink" class="hidden-nav-link">Dashboard</a>
                <a href="#" id="logoutButton" class="hidden-nav-link">Logout</a>
            </nav>

        </div>
    </header>

    <!-- REGISTRATION SECTION -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-heading">
                <p class="section-label">GET STARTED</p>
                <h1>Create Your Account</h1>
                <p>Join BlogSpace and start sharing your ideas.</p>
            </div>

            <form id="registerForm" method="POST">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group checkbox-group">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >
                    <label for="terms">I agree to the terms</label>
                </div>

                <button type="submit" class="primary-button">
                    Create Account
                </button>

                <p class="auth-footer">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </form>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
