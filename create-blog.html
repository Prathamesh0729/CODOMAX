
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create and publish a blog on BlogSpace.">

    <title>BlogSpace | Create Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="container navbar-container">

            <a href="index.html" class="logo">
                BlogSpace
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav-links" id="navLinks">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#featured">
                    Explore
                </a>

                <a href="dashboard.html" id="dashboardNavLink">
                    Dashboard
                </a>

                <a href="create-blog.html" class="nav-button active">
                    Create Blog
                </a>

                <a href="login.html" id="loginNavLink">
                    Login
                </a>

                <a href="register.html" id="signupNavLink">
                    Sign Up
                </a>

                <a href="#" id="logoutButton">
                    Logout
                </a>

            </nav>

        </div>

    </header>


    <!-- Create Blog -->
    <main class="create-blog-page">

        <div class="container">

            <div class="create-blog-header">

                <p class="section-label">
                    CREATE
                </p>

                <h1>
                    Write Your Blog
                </h1>

                <p>
                    Share your knowledge, ideas, and experiences.
                </p>

            </div>


            <!-- Blog Form -->
            <form
                class="blog-form"
                id="blogForm"
            >

                <!-- Title -->
                <div class="form-group">

                    <label for="blogTitle">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        id="blogTitle"
                        name="title"
                        placeholder="Enter your blog title"
                        minlength="5"
                        maxlength="150"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="blogCategory">
                        Category
                    </label>

                    <select
                        id="blogCategory"
                        name="category"
                        required
                    >

                        <option value="">
                            Select a category
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Design">
                            Design
                        </option>

                        <option value="Lifestyle">
                            Lifestyle
                        </option>

                        <option value="Education">
                            Education
                        </option>

                    </select>

                </div>


                <!-- Content -->
                <div class="form-group">

                    <label for="blogContent">
                        Content
                    </label>

                    <textarea
                        id="blogContent"
                        name="content"
                        rows="15"
                        placeholder="Start writing your blog..."
                        minlength="20"
                        required
                    ></textarea>

                </div>


                <!-- Actions -->
                <div class="blog-form-actions">

                    <a
                        href="dashboard.html"
                        class="secondary-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="button"
                        class="secondary-button"
                        id="saveDraftButton"
                        disabled
                    >
                        Save Draft
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Publish Blog
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 BlogSpace. All rights reserved.</p>
    </footer>


    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
