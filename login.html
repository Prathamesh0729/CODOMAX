<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Login to your BlogSpace account.">

    <title>BlogSpace | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container navbar-container">

            <a href="index.html" class="logo">
                BlogSpace
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#featured">Explore</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html" class="nav-button">Sign Up</a>
            </nav>

        </div>
    </header>


    <!-- Login -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">
                <p class="section-label">WELCOME BACK</p>

                <h1>Login to BlogSpace</h1>

                <p>
                    Sign in to continue writing and exploring blogs.
                </p>
            </div>


            <form class="auth-form" id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="checkbox-label">

                        <input type="checkbox" id="remember">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="primary-button auth-button">
                    Login
                </button>


                <p class="auth-footer">
                    Don't have an account?
                    <a href="register.html">Create one</a>
                </p>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-content">

            <div>
                <h3>BlogSpace</h3>

                <p>
                    A place to write, share, and discover ideas.
                </p>
            </div>

            <p>
                © 2026 BlogSpace. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
